    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div>
        <label class="form-heading">
            <h1>Login Form</h1>
        </label>
    </div>
    <div class="form-group">
        <label for="userName">User Name</label>
        <input type="email" class="form-control" id="userName" formControlName="userName" placeholder="Enter user name">

        <small *ngIf="loginForm.get('userName')?.touched 
                     && loginForm.get('userName')?.invalid">
            UserName is required
        </small>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" formControlName="password" placeholder="Enter password">

        <small *ngIf="loginForm.get('password')?.touched 
                     && loginForm.get('password')?.invalid">
            Password is required
        </small>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
        Login
    </button>

</form>
